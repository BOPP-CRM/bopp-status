owner: BOPP-CRM
repo: bopp-status

sites:
  - name: Bopp Portal
    url: https://portal.bopp.digital
    maxResponseTime: 3000
  - name: Bopp CRM
    url: https://crm.bopp.digital
    maxResponseTime: 3000
  - name: Bopp Odoo
    url: $ODOO_URL
    maxResponseTime: 5000

status-website:
  cname: status.bopp.digital
  name: BOPP Status
  logoUrl: https://www.bopp.digital/logo-mark-light.png
  favicon: https://www.bopp.digital/logo-mark-light.png
  introTitle: "**สถานะระบบ BOPP**"
  introMessage: ติดตามสถานะการให้บริการของระบบ BOPP แบบเรียลไทม์ หากพบปัญหาติดต่อทีมงานได้ที่ [bopp.digital](https://bopp.digital)
  theme: dark
  navbar:
    - title: สถานะ
      href: /
    - title: เว็บไซต์ BOPP
      href: https://bopp.digital
  css: |
    :root {
      --body-background-color: #001b44;
      --nav-background-color: #00122e;
      --card-background-color: #0a2a5c;
      --nav-current-border-bottom-color: #ff7e00;
      --link-color: #ff9a33;
    }
    a:hover { color: #ff7e00; }

i18n:
  allSystemsOperational: ระบบทั้งหมดทำงานปกติ
  liveStatus: สถานะปัจจุบัน
