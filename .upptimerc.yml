owner: BOPP-CRM
repo: bopp-status

sites:
  - name: Bopp Portal
    url: https://portal.bopp.digital
    maxResponseTime: 3000
  - name: Bopp CRM
    url: https://crm.bopp.digital
    maxResponseTime: 3000
  - name: Bopp Odoo
    url: $ODOO_URL
    maxResponseTime: 5000

status-website:
  cname: status.bopp.digital
  name: BOPP Status
  logoUrl: https://raw.githubusercontent.com/BOPP-CRM/bopp-status/master/assets/bopp.png
  favicon: https://raw.githubusercontent.com/BOPP-CRM/bopp-status/master/assets/bopp.png
  introTitle: "**สถานะระบบ BOPP**"
  introMessage: ติดตามสถานะการให้บริการของระบบ BOPP แบบเรียลไทม์
  theme: dark
  css: |
    :root {
      --body-background-color: #001b44;
      --nav-background-color: #00122e;
      --card-background-color: #0a2a5c;
      --nav-current-border-bottom-color: #ff7e00;
      --link-color: #ff9a33;
    }
    a:hover { color: #ff7e00; }

i18n:
  allSystemsOperational: ระบบทั้งหมดทำงานปกติ
  liveStatus: สถานะปัจจุบัน
  overallUptime: "Uptime รวม: $UPTIME"
  averageResponseTime: "เวลาตอบสนองเฉลี่ย: $TIME ms"
